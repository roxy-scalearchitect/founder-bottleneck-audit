              <button onClick={handleBack} disabled={currentQuestion === 0} className="transition-opacity duration-200" style={{ fontFamily: 'Inter, system-ui, sans-serif', fontSize: '13px', color: currentQuestion === 0 ? colors.dim : colors.muted, letterSpacing: '0.15em', cursor: currentQuestion === 0 ? 'default' : 'pointer', background: 'transparent', border: 'none' }}>← BACK</button>
              <button onClick={handleNext} disabled={selectedAnswer === null} className="px-8 py-3 rounded-full transition-all duration-300"
                style={{ background: selectedAnswer === null ? 'rgba(255,255,255,0.08)' : `linear-gradient(135deg, ${colors.gold} 0%, ${colors.goldLight} 50%, ${colors.gold} 100%)`, color: selectedAnswer === null ? colors.dim : colors.deepBurgundy, cursor: selectedAnswer === null ? 'not-allowed' : 'pointer', fontFamily: 'Inter, system-ui, sans-serif', fontSize: '14px', fontWeight: 700, letterSpacing: '0.12em', boxShadow: selectedAnswer === null ? 'none' : `0 4px 20px rgba(212, 165, 116, 0.35), inset 0 1px 0 rgba(255,255,255,0.3)`, border: 'none' }}
                onMouseEnter={(e) => { if (selectedAnswer !== null) { e.currentTarget.style.transform = 'translateY(-2px)'; e.currentTarget.style.boxShadow = `0 8px 28px rgba(212, 165, 116, 0.5), inset 0 1px 0 rgba(255,255,255,0.4)`; } }}
                onMouseLeave={(e) => { e.currentTarget.style.transform = 'translateY(0)'; if (selectedAnswer !== null) { e.currentTarget.style.boxShadow = `0 4px 20px rgba(212, 165, 116, 0.35), inset 0 1px 0 rgba(255,255,255,0.3)`; } }}>
                {currentQuestion === 19 ? 'SEE MY DIAGNOSIS →' : 'NEXT →'}
              </button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  if (screen === 'results') {
    return (
      <div className="min-h-screen w-full relative" style={{ ...pageBg, color: colors.cream }}>
        <NoiseOverlay />
        <div className={`relative z-10 max-w-3xl mx-auto px-6 sm:px-10 py-12 sm:py-16 transition-opacity duration-500 ${fadeIn ? 'opacity-100' : 'opacity-0'}`}>
          <div className="text-center mb-8">
            <div className="inline-block px-6 py-2 rounded-full mb-6" style={{ background: `linear-gradient(135deg, rgba(212, 165, 116, 0.15) 0%, rgba(212, 165, 116, 0.05) 100%)`, border: `1px solid rgba(212, 165, 116, 0.5)`, color: colors.goldLight, fontFamily: 'Inter, system-ui, sans-serif', fontSize: '12px', letterSpacing: '0.3em', fontWeight: 600, boxShadow: `0 0 20px rgba(212, 165, 116, 0.15)` }}>{tierInfo.badge}</div>
            <div className="mb-6" style={{ fontFamily: 'Georgia, serif', fontSize: '15px', color: colors.muted, letterSpacing: '0.05em' }}>YOUR SCORE: <span style={{ background: `linear-gradient(135deg, ${colors.gold} 0%, ${colors.goldLight} 100%)`, WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', backgroundClip: 'text', fontWeight: 700, fontSize: '18px' }}>{totalScore}</span> <span style={{ color: colors.dim }}>/ 100</span></div>
            <h1 className="mb-6" style={{ fontFamily: 'Georgia, "Times New Roman", serif', fontSize: 'clamp(40px, 6vw, 60px)', fontWeight: 600, lineHeight: 1.05, letterSpacing: '-0.02em' }}><span style={{ background: `linear-gradient(135deg, ${colors.cream} 0%, ${colors.goldLight} 100%)`, WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', backgroundClip: 'text' }}>{tierInfo.name}</span></h1>
            <p className="italic max-w-xl mx-auto" style={{ fontFamily: 'Georgia, serif', fontSize: '19px', color: colors.softCream, lineHeight: 1.5 }}>{tierInfo.verdict}</p>
          </div>
          <div className="my-12 flex justify-center"><div className="w-20 h-px" style={{ background: `linear-gradient(to right, transparent, ${colors.gold}, transparent)` }} /></div>
          <section className="mb-14 px-7 py-7 rounded-2xl" style={cardStyle}>
            <h3 className="mb-6" style={{ fontFamily: 'Georgia, serif', fontSize: '13px', color: colors.goldLight, letterSpacing: '0.25em', fontWeight: 500 }}>WHAT YOU HAVE ALREADY BUILT</h3>
            <ul className="space-y-3">
              {tierInfo.built.map((item, i) => (
                <li key={i} className="flex items-start gap-4">
                  <svg width="18" height="18" viewBox="0 0 18 18" className="mt-1 flex-shrink-0">
                    <defs><linearGradient id={`check-grad-${i}`} x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stopColor={colors.gold} /><stop offset="100%" stopColor={colors.goldLight} /></linearGradient></defs>
                    <path d="M3 9 L7 13 L15 5" stroke={`url(#check-grad-${i})`} strokeWidth="1.8" fill="none" strokeLinecap="round" strokeLinejoin="round" />
                  </svg>
                  <span style={{ fontFamily: 'Inter, system-ui, sans-serif', fontSize: '16px', lineHeight: 1.6, color: colors.cream }}>{item}</span>
                </li>
              ))}
            </ul>
          </section>
          <section className="mb-14">
            <h3 className="mb-6" style={{ fontFamily: 'Georgia, serif', fontSize: '13px', color: colors.goldLight, letterSpacing: '0.25em', fontWeight: 500 }}>WHAT IS ACTUALLY MISSING</h3>
            <p style={{ fontFamily: 'Inter, system-ui, sans-serif', fontSize: '17px', lineHeight: 1.7, color: colors.cream }}>{tierInfo.missing}</p>
          </section>
          <section className="mb-14 px-8 py-8 rounded-2xl relative overflow-hidden" style={{ background: 'linear-gradient(135deg, rgba(212, 165, 116, 0.10) 0%, rgba(212, 165, 116, 0.02) 100%)', border: `1px solid rgba(212, 165, 116, 0.3)`, boxShadow: `0 0 30px rgba(212, 165, 116, 0.08)` }}>
            <div className="absolute top-0 left-0 w-1 h-full" style={{ background: `linear-gradient(to bottom, ${colors.gold}, ${colors.goldLight})` }} />
            <h3 className="mb-4" style={{ fontFamily: 'Georgia, serif', fontSize: '13px', color: colors.goldLight, letterSpacing: '0.25em', fontWeight: 600 }}>{tier === 5 ? 'THE HONEST NOTE' : 'THE REVENUE COST'}</h3>
            <p style={{ fontFamily: 'Inter, system-ui, sans-serif', fontSize: '17px', lineHeight: 1.7, color: colors.cream }}>{tierInfo.cost}</p>
          </section>
          <section className="mb-14">
            <h3 className="mb-6" style={{ fontFamily: 'Georgia, serif', fontSize: 'clamp(24px, 3vw, 30px)', fontWeight: 500, letterSpacing: '-0.01em' }}><span style={{ background: `linear-gradient(135deg, ${colors.cream} 0%, ${colors.goldLight} 100%)`, WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', backgroundClip: 'text' }}>Your 7-Day Quick Win</span></h3>
            <div className="mb-7 pl-6 pr-5 py-5 rounded-r-xl" style={{ borderLeft: `2px solid ${colors.gold}`, background: 'linear-gradient(90deg, rgba(212, 165, 116, 0.06) 0%, transparent 100%)' }}>
              <p className="italic" style={{ fontFamily: 'Georgia, serif', fontSize: '17px', lineHeight: 1.7, color: colors.softCream }}>{tierInfo.quickWinTruth}</p>
            </div>
            <p className="mb-4" style={{ fontFamily: 'Inter, system-ui, sans-serif', fontSize: '15px', fontWeight: 600, color: colors.goldLight, letterSpacing: '0.02em' }}>{tierInfo.quickWinHeader}</p>
            <ol className="mb-6 space-y-3 pl-1">
              {tierInfo.quickWinSteps.map((step, i) => (
                <li key={i} className="flex gap-4">
                  <span className="flex-shrink-0" style={{ fontFamily: 'Georgia, serif', fontSize: '16px', color: colors.gold, fontWeight: 600, fontStyle: 'italic', minWidth: '22px' }}>{i + 1}.</span>
                  <span style={{ fontFamily: 'Inter, system-ui, sans-serif', fontSize: '16px', lineHeight: 1.6, color: colors.cream }}>{step}</span>
                </li>
              ))}
            </ol>
            <p className="mb-3" style={{ fontFamily: 'Inter, system-ui, sans-serif', fontSize: '15px', fontWeight: 600, color: colors.goldLight, letterSpacing: '0.02em' }}>Why this works:</p>
            <p style={{ fontFamily: 'Inter, system-ui, sans-serif', fontSize: '16px', lineHeight: 1.7, color: colors.cream }}>{tierInfo.quickWinWhy}</p>
          </section>
          <section className="mb-14">
            <h3 className="mb-6" style={{ fontFamily: 'Georgia, serif', fontSize: 'clamp(24px, 3vw, 30px)', fontWeight: 500, letterSpacing: '-0.01em' }}><span style={{ background: `linear-gradient(135deg, ${colors.cream} 0%, ${colors.goldLight} 100%)`, WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', backgroundClip: 'text' }}>Your 30-Day Shift</span></h3>
            <div className="mb-7 pl-6 pr-5 py-5 rounded-r-xl" style={{ borderLeft: `2px solid ${colors.gold}`, background: 'linear-gradient(90deg, rgba(212, 165, 116, 0.06) 0%, transparent 100%)' }}>
              <p className="italic" style={{ fontFamily: 'Georgia, serif', fontSize: '17px', lineHeight: 1.7, color: colors.softCream }}>{tierInfo.shiftTruth}</p>
            </div>
            <p className="mb-4" style={{ fontFamily: 'Inter, system-ui, sans-serif', fontSize: '15px', fontWeight: 600, color: colors.goldLight, letterSpacing: '0.02em' }}>{tierInfo.shiftHeader}</p>
            <ol className="mb-6 space-y-3 pl-1">
              {tierInfo.shiftSteps.map((step, i) => (
                <li key={i} className="flex gap-4">
                  <span className="flex-shrink-0" style={{ fontFamily: 'Georgia, serif', fontSize: '16px', color: colors.gold, fontWeight: 600, fontStyle: 'italic', minWidth: '22px' }}>{i + 1}.</span>
                  <span style={{ fontFamily: 'Inter, system-ui, sans-serif', fontSize: '16px', lineHeight: 1.6, color: colors.cream }}>{step}</span>
                </li>
              ))}
            </ol>
            <p className="mb-3" style={{ fontFamily: 'Inter, system-ui, sans-serif', fontSize: '15px', fontWeight: 600, color: colors.goldLight, letterSpacing: '0.02em' }}>Why this works:</p>
            <p style={{ fontFamily: 'Inter, system-ui, sans-serif', fontSize: '16px', lineHeight: 1.7, color: colors.cream }}>{tierInfo.shiftWhy}</p>
          </section>
          <section className="mb-14">
            <h3 className="mb-6" style={{ fontFamily: 'Georgia, serif', fontSize: 'clamp(24px, 3vw, 30px)', fontWeight: 500, letterSpacing: '-0.01em' }}><span style={{ background: `linear-gradient(135deg, ${colors.cream} 0%, ${colors.goldLight} 100%)`, WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', backgroundClip: 'text' }}>Your 90-Day Rebuild</span></h3>
            <p style={{ fontFamily: 'Inter, system-ui, sans-serif', fontSize: '17px', lineHeight: 1.7, color: colors.cream }}>{tierInfo.rebuild}</p>
          </section>
          <section className="mb-12 px-8 py-12 rounded-2xl text-center relative overflow-hidden" style={{ background: `linear-gradient(135deg, ${colors.gold} 0%, ${colors.goldLight} 50%, ${colors.gold} 100%)`, boxShadow: `0 8px 40px rgba(212, 165, 116, 0.25), inset 0 1px 0 rgba(255,255,255,0.4)` }}>
            <div className="absolute inset-0 opacity-30" style={{ background: `radial-gradient(ellipse at top, rgba(255,255,255,0.4) 0%, transparent 60%)` }} />
            <div className="relative z-10">
              <p className="mb-7 italic max-w-lg mx-auto" style={{ fontFamily: 'Georgia, serif', fontSize: '19px', lineHeight: 1.5, color: colors.deepBurgundy, fontWeight: 500 }}>{tierInfo.cta}</p>
              <a href={CALENDLY_URL} target="_blank" rel="noopener noreferrer" className="inline-block px-10 py-4 rounded-full transition-all duration-300"
                style={{ background: `linear-gradient(135deg, ${colors.deepBurgundy} 0%, ${colors.burgundy} 100%)`, color: colors.goldLight, fontFamily: 'Inter, system-ui, sans-serif', fontSize: '14px', fontWeight: 700, letterSpacing: '0.12em', textDecoration: 'none', boxShadow: `0 4px 16px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1)` }}
                onMouseEnter={(e) => { e.currentTarget.style.transform = 'translateY(-2px)'; e.currentTarget.style.boxShadow = `0 8px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.15)`; }}
                onMouseLeave={(e) => { e.currentTarget.style.transform = 'translateY(0)'; e.currentTarget.style.boxShadow = `0 4px 16px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1)`; }}>
                {tierInfo.ctaButton.toUpperCase()} →
              </a>
            </div>
          </section>
        </div>
      </div>
    );
  }
  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<FounderBottleneckAudit />);
</script>
</body>
</html>
